# Configuration for Parameters Sensitivity Analysis (PSA) of Andrews Forest storm model.

# Settings of SEIMS-based model
[SEIMS_Model]
HOST = 127.0.0.1
PORT = 27017
CFG_NAME = storm
TIMESTEP = 300
BIN_DIR = E:\code\compile\SEIMS_msvc2019\bin
MODEL_DIR = E:\code\SEIMS\data\Andrews_Forest\Andrews_Forest_model
DB_NAME = andrews_forest_model
VERSION = OMP
MPI_BIN = mpiexec
HOSTS_OPT =
HOSTFILE =
NPROCESS = 1
NPERNODE = 1
FLAG_NPERNODE = -ppn
NTHREAD = 4
FDIRMTD = 0
LYRMTD = 1
SCENARIO_ID = -1
CALIBRATION_ID = -1
SUBBASIN_ID = 0
SIMU_STIME = 2015-02-05 07:00:00
SIMU_ETIME = 2015-02-08 20:00:00
OUT_STIME =
OUT_ETIME =
WORKLOAD = cmd

# Settings of computing resources
[Computing_Resources]
# (Optional) Use workload manager to run multiple models simultaneously.
#    Available: slurm, cmd or bash (for testing on Windows and Linux, respectively).
WORKLOAD = cmd
# Nodes partition
PARTITION = work
# Computing nodes required
NNODES = 1
# Maximum tasks allowed to run on each node, e.g., process of MPI and task of scoop
NTASKS_PERNODE = 4
# Maximum cores/processors available of each node
NCORES_PERNODE = 4

# Settings of PSA.
[PSA_Settings]
# Parameters to be evaluated, currently, only Q and SED are supported, i.e., 'Q', 'SED', or 'Q,SED'
evaluateParam = Q
# Parameters and ranges
paramRngDef = psa_param_rng.def
# Objective calculation period (UTCTIME)
PSA_Time_start = 2015-02-05 07:00:00
PSA_Time_end = 2015-02-08 20:00:00
# Task name, this name will override the task name in [SEIMS_Model]
TASK_NAME = PSA_AndrewsForest_storm

# Specific settings of sensitivity analysis methods, e.g., Morris, FAST, etc.
[Morris_Method]
N = 4
num_levels = 2
grid_jump = 1
# optimal_trajectories 2 ~ N, or set to None
optimal_trajectories = None
# Use local optimization according to Ruano et al. (2012) to
#   speed up the process tremendously for bigger N and num_levels
local_optimization = True

[FAST_Method]
# Sample size. Number of model runs is ND ; must choose N > 4M^2 (N > 64 under default settings)
N = 65
# FAST M coefficient, default 4
M = 4

# Plot settings for matplotlib
[OPTIONAL_MATPLOT_SETTINGS]
FIGURE_FORMATS = PDF,PNG
FONT_TITLE =  DejaVu Sans
TITLE_FONTSIZE = 14
LEGEND_FONTSIZE = 12
TICKLABEL_FONTSIZE = 12
AXISLABEL_FONTSIZE = 12
LABEL_FONTSIZE = 14
DPI = 300
