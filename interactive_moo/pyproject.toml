[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-moo"
version = "0.1.0"
description = "Domain-independent interactive multi-objective optimization for DEAP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["deap>=1.3", "numpy>=1.20"]

[project.scripts]
interactive-moo = "interactive_moo.run_interactive:main"

[tool.setuptools]
package-dir = {interactive_moo = "."}
packages = ["interactive_moo"]
